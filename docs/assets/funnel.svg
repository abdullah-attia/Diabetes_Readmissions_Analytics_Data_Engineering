<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Record funnel: 101,766 raw stays, 3 rejected, 101,763 clean stays, 2,423 excluded for death or hospice, 99,340 eligible for the readmission rate" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .lab{fill:#172033;font-size:15px;font-weight:700}
    .val{fill:#FFFFFF;font-size:15px;font-weight:700}
    .note{fill:#566173;font-size:13px}
    .bar{transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
  </style>
  <rect width="1200" height="250" rx="18" fill="#F6F7F9"/>
  <text class="t" x="40" y="42" fill="#2563C9" font-size="14" font-weight="700" letter-spacing="2">EVERY RECORD IS ACCOUNTED FOR</text>
  <g class="t">
    <text class="lab" x="40" y="88">Raw stays</text>
    <g class="bar" style="transform-origin:240px 0;animation-delay:.2s"><rect x="240" y="66" width="900" height="34" rx="8" fill="#172033"/></g>
    <text class="val" x="256" y="89">101,766</text>

    <text class="lab" x="40" y="138">Clean stays</text>
    <g class="bar" style="transform-origin:240px 0;animation-delay:.7s"><rect x="240" y="116" width="899.97" height="34" rx="8" fill="#2563C9"/></g>
    <text class="val" x="256" y="139">101,763</text>
    <text class="note" x="880" y="139" style="fill:#FFFFFF">− 3 rejected: invalid gender</text>

    <text class="lab" x="40" y="188">Eligible for the rate</text>
    <g class="bar" style="transform-origin:240px 0;animation-delay:1.2s"><rect x="240" y="166" width="878.5" height="34" rx="8" fill="#4CA38F"/></g>
    <text class="val" x="256" y="189">99,340</text>
    <text class="note" x="790" y="189" style="fill:#FFFFFF">− 2,423 died or went to hospice</text>
  </g>
  <text class="t note" x="40" y="230">Raw (101,766) = Clean (101,763) + Rejected (3): zero rows lost. Deaths stay in length-of-stay metrics but never count as readmissions.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
