<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Diabetes Readmissions Analytics: from messy hospital records to decisions" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#1F3A6B"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563C9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8FB4F0"/>
      <stop offset="1" stop-color="#2563C9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typing"><rect x="70" y="150" width="0" height="40">
      <animate attributeName="width" from="0" to="1000" dur="3s" begin="0.8s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .eyebrow{fill:#8FB4F0;font-size:16px;font-weight:700;letter-spacing:3px}
    .title{fill:#FFFFFF;font-size:46px;font-weight:800}
    .sub{fill:#C9D3E3;font-size:22px}
    .ecg{fill:none;stroke:#E8853D;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 4s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:1400}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-1400}}
    .fade{opacity:0;animation:fade 1s ease forwards}
    @keyframes fade{to{opacity:1}}
  </style>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <path class="ecg" d="M0 225 H380 L400 225 L415 195 L430 250 L445 205 L458 225 H700 L718 225 L732 198 L746 248 L760 210 L772 225 H1200"/>
  <text class="t eyebrow fade" x="70" y="62">DATA ENGINEERING PROJECT</text>
  <text class="t title fade" x="70" y="120" style="animation-delay:.3s">Diabetes Readmissions Analytics</text>
  <text class="t sub" x="70" y="178" clip-path="url(#typing)">From messy hospital records to decisions · SSIS → Spark → Snowflake → dbt → Power BI</text>
  <circle cx="1110" cy="70" r="7" fill="#4CA38F"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text class="t" x="1092" y="75" fill="#C9D3E3" font-size="14" text-anchor="end">pipeline: one click</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
