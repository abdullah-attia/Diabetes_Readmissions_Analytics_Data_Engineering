<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Highlights: 101,766 hospital stays, 11.4% 30-day readmission rate, 9.01% vs 9.0% benchmark, 7 min 46 s one-click run" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .card{fill:#FFFFFF;stroke:#DCE1E8;stroke-width:1.5}
    .num{fill:#2563C9;font-size:40px;font-weight:800}
    .lab{fill:#566173;font-size:15px}
    .in{opacity:0;transform:translateY(12px);animation:up .8s ease forwards}
    @keyframes up{to{opacity:1;transform:translateY(0)}}
  </style>
  <rect width="1200" height="170" rx="18" fill="#F6F7F9"/>
  <g class="t">
    <g class="in" style="animation-delay:.1s"><rect class="card" x="30" y="30" width="262" height="110" rx="14"/>
      <text class="num" x="54" y="88">101,766</text><text class="lab" x="54" y="118">hospital stays, 130 US hospitals</text></g>
    <g class="in" style="animation-delay:.5s"><rect class="card" x="322" y="30" width="262" height="110" rx="14"/>
      <text class="num" x="346" y="88" fill="#B4541A" style="fill:#B4541A">11.4%</text><text class="lab" x="346" y="118">30-day readmission rate</text></g>
    <g class="in" style="animation-delay:.9s"><rect class="card" x="614" y="30" width="262" height="110" rx="14"/>
      <text class="num" x="638" y="88">9.01%</text><text class="lab" x="638" y="118">vs 9.0% in the published study</text></g>
    <g class="in" style="animation-delay:1.3s"><rect class="card" x="906" y="30" width="262" height="110" rx="14"/>
      <text class="num" x="930" y="88">7m 46s</text><text class="lab" x="930" y="118">one click, raw files → dashboard</text></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
