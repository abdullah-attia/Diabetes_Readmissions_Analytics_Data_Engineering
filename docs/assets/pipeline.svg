<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Animated pipeline: Raw CSV, SSIS, SQL Server, PySpark, Snowflake, dbt, Power BI, orchestrated by Airflow" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .name{fill:#172033;font-size:16px;font-weight:700}
    .what{fill:#566173;font-size:12px}
    .own{font-size:11px;font-weight:700;letter-spacing:1px}
    .node{fill:#FFFFFF;stroke:#DCE1E8;stroke-width:1.5}
    .glow{fill:none;stroke:#2563C9;stroke-width:3;opacity:0;animation:glow 7s infinite}
    @keyframes glow{0%,100%{opacity:0}4%{opacity:1}14%{opacity:0}}
    .wire{stroke:#C9D3E3;stroke-width:3;stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .band{fill:#E8EFFB;stroke:#2563C9;stroke-width:1.5;stroke-dasharray:5 5}
  </style>
  <rect width="1200" height="330" rx="18" fill="#F6F7F9"/>
  <text class="t" x="40" y="44" fill="#2563C9" font-size="14" font-weight="700" letter-spacing="2">HOW THE DATA FLOWS</text>

  <!-- wires -->
  <g>
    <line class="wire" x1="170" y1="130" x2="190" y2="130"/>
    <line class="wire" x1="330" y1="130" x2="350" y2="130"/>
    <line class="wire" x1="490" y1="130" x2="510" y2="130"/>
    <line class="wire" x1="650" y1="130" x2="670" y2="130"/>
    <line class="wire" x1="810" y1="130" x2="830" y2="130"/>
    <line class="wire" x1="970" y1="130" x2="990" y2="130"/>
  </g>

  <!-- data packet travelling the whole line -->
  <circle r="7" fill="#E8853D">
    <animateMotion dur="7s" repeatCount="indefinite" path="M100 130 H1060" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes: x step 160 -->
  <g class="t">
    <g transform="translate(30,80)"><rect class="node" width="140" height="100" rx="14"/><rect class="glow" width="140" height="100" rx="14" style="animation-delay:0s"/>
      <text class="name" x="70" y="40" text-anchor="middle">Raw CSV</text><text class="what" x="70" y="62" text-anchor="middle">UCI · 101,766 rows</text>
      <text class="own" x="70" y="125" text-anchor="middle" fill="#566173">SOURCE</text></g>
    <g transform="translate(190,80)"><rect class="node" width="140" height="100" rx="14"/><rect class="glow" width="140" height="100" rx="14" style="animation-delay:1s"/>
      <text class="name" x="70" y="40" text-anchor="middle">SSIS</text><text class="what" x="70" y="62" text-anchor="middle">2 packages + audit</text>
      <text class="own" x="70" y="125" text-anchor="middle" fill="#B4541A">MEMBER A</text></g>
    <g transform="translate(350,80)"><rect class="node" width="140" height="100" rx="14"/><rect class="glow" width="140" height="100" rx="14" style="animation-delay:2s"/>
      <text class="name" x="70" y="40" text-anchor="middle">SQL Server</text><text class="what" x="70" y="62" text-anchor="middle">staging · 15 checks</text>
      <text class="own" x="70" y="125" text-anchor="middle" fill="#B4541A">MEMBER A</text></g>
    <g transform="translate(510,80)"><rect class="node" width="140" height="100" rx="14"/><rect class="glow" width="140" height="100" rx="14" style="animation-delay:3s"/>
      <text class="name" x="70" y="40" text-anchor="middle">PySpark</text><text class="what" x="70" y="62" text-anchor="middle">10 cleaning rules</text>
      <text class="own" x="70" y="125" text-anchor="middle" fill="#4CA38F">MEMBER B</text></g>
    <g transform="translate(670,80)"><rect class="node" width="140" height="100" rx="14"/><rect class="glow" width="140" height="100" rx="14" style="animation-delay:4s"/>
      <text class="name" x="70" y="40" text-anchor="middle">Snowflake</text><text class="what" x="70" y="62" text-anchor="middle">RAW · row counts</text>
      <text class="own" x="70" y="125" text-anchor="middle" fill="#2563C9">LEADER</text></g>
    <g transform="translate(830,80)"><rect class="node" width="140" height="100" rx="14"/><rect class="glow" width="140" height="100" rx="14" style="animation-delay:5s"/>
      <text class="name" x="70" y="40" text-anchor="middle">dbt</text><text class="what" x="70" y="62" text-anchor="middle">star schema · 52 tests</text>
      <text class="own" x="70" y="125" text-anchor="middle" fill="#2563C9">LEADER</text></g>
    <g transform="translate(990,80)"><rect class="node" width="140" height="100" rx="14"/><rect class="glow" width="140" height="100" rx="14" style="animation-delay:6s"/>
      <text class="name" x="70" y="40" text-anchor="middle">Power BI</text><text class="what" x="70" y="62" text-anchor="middle">5-page dashboard</text>
      <text class="own" x="70" y="125" text-anchor="middle" fill="#2563C9">LEADER</text></g>
  </g>

  <!-- airflow band -->
  <rect class="band" x="30" y="240" width="1100" height="56" rx="14"/>
  <text class="t" x="56" y="274" fill="#172033" font-size="15" font-weight="700">Airflow (Docker)</text>
  <text class="t" x="200" y="274" fill="#566173" font-size="14">runs every step in order and stops if any check fails · one click · full run 7 min 46 s</text>
  <circle cx="1100" cy="268" r="7" fill="#4CA38F"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
