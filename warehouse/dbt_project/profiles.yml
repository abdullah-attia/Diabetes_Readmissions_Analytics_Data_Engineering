readmissions:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SF_ACCOUNT') }}"
      user: "{{ env_var('SF_USER') }}"
      private_key_path: "{{ env_var('SF_PRIVATE_KEY_PATH') }}"
      role: TRANSFORMER
      warehouse: READMISSIONS_WH
      database: READMISSIONS_DW
      schema: ANALYTICS
      threads: 4